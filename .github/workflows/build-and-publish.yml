name: Build and Publish MATCH

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  LINUXDEPLOY_VERSION: 1-alpha-20251107-1
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - platform: win
            os: windows-latest
          - platform: mac
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    env:
      SRC_FILES: >
        engine/app/StandaloneMain.cpp
        engine/app/src/AssetFS.cpp
        engine/core/src/Board.cpp
        engine/core/src/AI.cpp
        engine/core/src/GameConfig.cpp
        engine/core/src/SavePayload.cpp
        engine/platform/src/AudioSystem.cpp
        engine/platform/src/SdlInput.cpp
        engine/platform/src/SdlSaveService.cpp
        engine/ui/src/Screens.cpp
        engine/render/src/SceneRenderer.cpp
      INCLUDE_FLAGS: >
        -Iengine/app/include
        -Iengine/platform/include
        -Iengine/ui/include
        -Iengine/render/include
        -Iengine/core/include
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'win'
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-SDL2_mixer
            mingw-w64-ucrt-x86_64-SDL2_image

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config \
            libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev libsdl2-image-dev
          curl --fail --location --show-error \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage" \
            -o linuxdeploy
          echo "${LINUXDEPLOY_SHA256}  linuxdeploy" | sha256sum --check --strict
          chmod +x linuxdeploy

      - name: Install dependencies (macOS)
        if: matrix.platform == 'mac'
        run: |
          brew update
          brew install sdl2 sdl2_ttf sdl2_mixer sdl2_image pkg-config

      - name: Build Windows binary
        if: matrix.platform == 'win'
        shell: msys2 {0}
        run: |
          mkdir -p build/win
          windres -O coff -F pe-x86-64 assets_win/MATCH_Resources.rc build/win/MATCH_Resources.res
          SRC="${SRC_FILES}"
          INC="${INCLUDE_FLAGS}"
          PKG_FLAGS="$(pkg-config --cflags --libs sdl2 SDL2_ttf SDL2_mixer SDL2_image)"
          g++ -std=c++17 -O2 $INC $SRC build/win/MATCH_Resources.res -lmingw32 -lSDL2main $PKG_FLAGS -static-libstdc++ -static-libgcc -o build/win/MATCH.exe

      - name: Build Linux binary
        if: matrix.platform == 'linux'
        run: |
          mkdir -p build/linux
          SRC="${SRC_FILES}"
          INC="${INCLUDE_FLAGS}"
          PKG_FLAGS="$(pkg-config --cflags --libs sdl2 SDL2_ttf SDL2_mixer SDL2_image)"
          g++ -std=c++17 -O2 $INC $SRC $PKG_FLAGS -o build/linux/MATCH

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          APPDIR=appimage/AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp build/linux/MATCH "$APPDIR/usr/bin/MATCH"
          chmod +x "$APPDIR/usr/bin/MATCH"
          mkdir -p "$APPDIR/usr/bin/assets"
          cp -a assets_common/. "$APPDIR/usr/bin/assets/"
          if [ -d assets_linux ]; then cp -a assets_linux/. "$APPDIR/usr/bin/assets/"; fi
          DESKTOP_FILE="$APPDIR/usr/share/applications/match.desktop"
          printf '%s\n' \
            "[Desktop Entry]" \
            "Type=Application" \
            "Name=MATCH" \
            "Exec=MATCH" \
            "Icon=match" \
            "Categories=Game;" \
            "Terminal=false" > "$DESKTOP_FILE"
          if [ -f assets_linux/icon.png ]; then
            cp assets_linux/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/match.png"
          elif [ -f assets_common/icon.png ]; then
            cp assets_common/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/match.png"
          fi
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy --appdir "$APPDIR" --desktop-file "$DESKTOP_FILE" --icon-file "$APPDIR/usr/share/icons/hicolor/256x256/apps/match.png" --executable "$APPDIR/usr/bin/MATCH" --output appimage
          mv MATCH-*.AppImage build/linux/MATCH.AppImage

      - name: Build macOS binary
        if: matrix.platform == 'mac'
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig
        run: |
          mkdir -p build/mac
          SRC="${SRC_FILES}"
          INC="${INCLUDE_FLAGS}"
          PKG_FLAGS="$(pkg-config --cflags --libs sdl2 SDL2_ttf SDL2_mixer SDL2_image)"
          clang++ -std=c++17 -O2 $INC $SRC $PKG_FLAGS -framework Cocoa -o build/mac/MATCH

      - name: Stage Windows artifact
        if: matrix.platform == 'win'
        shell: msys2 {0}
        run: |
          DEST=artifacts/win
          rm -rf "$DEST"
          mkdir -p "$DEST/assets"
          cp build/win/MATCH.exe "$DEST/MATCH.exe"
          cp -a assets_common/. "$DEST/assets/"
          if [ -d assets_win ]; then cp -a assets_win/. "$DEST/assets/"; fi
          rm -rf "$DEST/saves"

      - name: Stage Linux artifact
        if: matrix.platform == 'linux'
        run: |
          DEST=artifacts/linux
          rm -rf "$DEST"
          mkdir -p "$DEST/assets"
          cp build/linux/MATCH "$DEST/MATCH"
          chmod +x "$DEST/MATCH"
          if [ -f build/linux/MATCH.AppImage ]; then cp build/linux/MATCH.AppImage "$DEST/MATCH.AppImage"; fi
          cp -a assets_common/. "$DEST/assets/"
          if [ -d assets_linux ]; then cp -a assets_linux/. "$DEST/assets/"; fi
          rm -rf "$DEST/saves"

      - name: Stage macOS artifact
        if: matrix.platform == 'mac'
        run: |
          DEST=artifacts/mac
          APP="$DEST/MATCH.app"
          MACOS="$APP/Contents/MacOS"
          RES="$APP/Contents/Resources"
          rm -rf "$DEST"
          mkdir -p "$MACOS" "$RES"
          cp build/mac/MATCH "$MACOS/MATCH"
          chmod +x "$MACOS/MATCH"
          mkdir -p "$MACOS/assets"
          cp -a assets_common/. "$MACOS/assets/"
          if [ -d assets_mac ]; then cp -a assets_mac/. "$MACOS/assets/"; fi
          rm -f "$MACOS/assets/icon.icns" "$MACOS/assets/Info.plist"
          if [ -f assets_mac/icon.icns ]; then cp assets_mac/icon.icns "$RES/icon.icns"; fi
          if [ -f assets_mac/Info.plist ]; then cp assets_mac/Info.plist "$APP/Contents/Info.plist"; fi
          rm -rf "$DEST/saves"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.platform }}-build
          path: artifacts/${{ matrix.platform }}

  publish:
    name: Publish artifacts
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Switch to builds branch
        run: |
          git fetch origin builds || true
          git checkout builds || git checkout -b builds

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: win-build
          path: artifacts/win

      - name: Download macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mac-build
          path: artifacts/mac

      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-build
          path: artifacts/linux

      - name: Sync artifacts into builds branch
        run: |
          rm -rf win/*
          rm -rf mac/*
          rm -rf linux/*
          cp -a artifacts/win/. win/
          cp -a artifacts/mac/. mac/
          cp -a artifacts/linux/. linux/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add win mac linux
          if git diff --cached --quiet; then
            echo "No updates to publish."
            exit 0
          fi
          git commit -m "Update MATCH builds (${GITHUB_RUN_ID})"
          git push origin HEAD:builds
